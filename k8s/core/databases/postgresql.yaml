---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: opendesk
  labels:
    app: postgresql
    component: database
    tier: backend
    platform: opendesk
    version: "16.3-nixos"
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      serviceAccountName: opendesk-service-account
      containers:
        - name: postgresql
          image: registry.opencode.de/umr/opendesk-edu/opendesk-nix/postgresql:16.3-nixos
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: password
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-secrets
                  key: username
            - name: POSTGRES_DB
              value: "opendesk"
            - name: PGDATA
              value: "/var/lib/postgresql/data"
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", $(POSTGRES_USER)]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", $(POSTGRES_USER)]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: postgresql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: opendesk
  labels:
    app: postgresql
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: opendesk
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---