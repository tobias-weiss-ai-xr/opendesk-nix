---
# Redis Secrets Template
# 
# USAGE:
#   1. cp redis-secrets-template.yaml redis-secrets.yaml
#   2. Edit redis-secrets.yaml and replace CHANGE_ME values
#   3. kubectl apply -f redis-secrets.yaml
#   4. NEVER commit redis-secrets.yaml to version control!
#
# Optional: Required only if Redis password authentication is enabled

apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
  namespace: opendesk
  labels:
    app: redis
    component: database
    platform: opendesk
type: Opaque
stringData:
  # Redis password (can be empty for no authentication)
  password: ""
