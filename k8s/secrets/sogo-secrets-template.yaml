---
# SOGo Groupware Secrets Template
# 
# USAGE:
#   1. cp sogo-secrets-template.yaml sogo-secrets.yaml
#   2. Edit sogo-secrets.yaml and replace all CHANGE_ME values
#   3. kubectl apply -f sogo-secrets.yaml
#   4. NEVER commit sogo-secrets.yaml to version control!
#
# Required by: groupware/sogo.yaml

apiVersion: v1
kind: Secret
metadata:
  name: sogo-secrets
  namespace: opendesk
  labels:
    app: sogo
    component: groupware
    platform: opendesk
type: Opaque
stringData:
  # Database connection credentials
  db-username: "CHANGE_ME"
  db-password: "CHANGE_ME 최소 32자리 strong password"
  
  # Mail system credentials
  mail-admin-username: "CHANGE_ME"
  mail-admin-password: "CHANGE_ME"
  
  # Optional: SOGo superuser credentials
  sogo-admin-username: "admin"
  sogo-admin-password: "CHANGE_ME"
