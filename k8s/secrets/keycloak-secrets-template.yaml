---
# Keycloak Identity Provider Secrets Template
# 
# USAGE:
#   1. cp keycloak-secrets-template.yaml keycloak-secrets.yaml
#   2. Edit keycloak-secrets.yaml and replace all CHANGE_ME values
#   3. kubectl apply -f keycloak-secrets.yaml
#   4. NEVER commit keycloak-secrets.yaml to version control!
#
# Required by: core/identity/keycloak.yaml

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secrets
  namespace: opendesk
  labels:
    app: keycloak
    component: identity
    platform: opendesk
type: Opaque
stringData:
  # Keycloak admin credentials
  admin-username: "admin"
  admin-password: "CHANGE_ME 최소 32자리 strong password"
  
  # Database connection credentials (if using external database)
  db-username: "keycloak"
  db-password: "CHANGE_ME"
