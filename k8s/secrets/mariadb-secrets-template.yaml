---
# MariaDB Database Secrets Template
# 
# USAGE:
#   1. cp mariadb-secrets-template.yaml mariadb-secrets.yaml
#   2. Edit mariadb-secrets.yaml and replace all CHANGE_ME values
#   3. kubectl apply -f mariadb-secrets.yaml
#   4. NEVER commit mariadb-secrets.yaml to version control!
#
# Required by: core/databases/mariadb.yaml

apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secrets
  namespace: opendesk
  labels:
    app: mariadb
    component: database
    platform: opendesk
type: Opaque
stringData:
  # Root password (required)
  root-password: "CHANGE_ME 최소 32자리 strong password"
  
  # Application database user
  username: "CHANGE_ME"
  
  # Application database password
  password: "CHANGE_ME 최소 32자리 strong password"
  
  # Optional: Replication user
  replication-username: "repl_user"
  replication-password: "CHANGE_ME 머신 간 복제용"
