---
# PostgreSQL Database Secrets Template
# 
# USAGE:
#   1. cp postgresql-secrets-template.yaml postgresql-secrets.yaml
#   2. Edit postgresql-secrets.yaml and replace all CHANGE_ME values
#   3. kubectl apply -f postgresql-secrets.yaml
#   4. NEVER commit postgresql-secrets.yaml to version control!
#
# Required by: core/databases/postgresql.yaml

apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secrets
  namespace: opendesk
  labels:
    app: postgresql
    component: database
    platform: opendesk
type: Opaque
stringData:
  # Admin user password (required)
  admin-password: "CHANGE_ME 최소 32자리 strong password"
  
  # Application database user
  username: "CHANGE_ME"
  
  # Application database password
  password: "CHANGE_ME 최소 32자리 strong password"
