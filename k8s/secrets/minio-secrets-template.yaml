---
# MinIO Object Storage Secrets Template
# 
# USAGE:
#   1. cp minio-secrets-template.yaml minio-secrets.yaml
#   2. Edit minio-secrets.yaml and replace all CHANGE_ME values
#   3. kubectl apply -f minio-secrets.yaml
#   4. NEVER commit minio-secrets.yaml to version control!
#
# Required by: core/storage/minio.yaml

apiVersion: v1
kind: Secret
metadata:
  name: minio-secrets
  namespace: opendesk
  labels:
    app: minio
    component: storage
    platform: opendesk
type: Opaque
stringData:
  # MinIO root credentials (required)
  root-user: "CHANGE_ME"
  root-password: "CHANGE_ME 최소 32자리 strong password"
