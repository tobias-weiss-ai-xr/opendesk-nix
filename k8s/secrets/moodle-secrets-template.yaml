---
# Moodle LMS Secrets Template
# 
# USAGE:
#   1. cp moodle-secrets-template.yaml moodle-secrets.yaml
#   2. Edit moodle-secrets.yaml and replace all CHANGE_ME values
#   3. kubectl apply -f moodle-secrets.yaml
#   4. NEVER commit moodle-secrets.yaml to version control!
#
# Required by: learning/moodle.yaml

apiVersion: v1
kind: Secret
metadata:
  name: moodle-secrets
  namespace: opendesk
  labels:
    app: moodle
    component: lms
    platform: opendesk
type: Opaque
stringData:
  # Database connection credentials
  db-username: "CHANGE_ME"
  db-password: "CHANGE_ME 최소 32자리 strong password"
  
  # Moodle application credentials
  moodle-admin-email: "admin@opendesk.hrz.uni-marburg.de"
  moodle-admin-password: "CHANGE_ME"
