---
# OpenDesk Edu NixOS - Complete Deployment List
# This file lists all 78 services that have been pushed to:
# registry.opencode.de/umr/opendesk-edu/opendesk-nix
#
# To deploy all services, apply the individual manifests in each directory:
#   kubectl apply -f namespace.yaml
#   kubectl apply -f image-pull-secret.yaml
#   kubectl apply -Rf core/
#   kubectl apply -Rf groupware/
#   kubectl apply -Rf learning/
#   etc.

apiVersion: v1
kind: ConfigMap
metadata:
  name: opendesk-deployment-info
  namespace: opendesk
  labels:
    app: opendesk
    component: deployment-info
data:
  registry: "registry.opencode.de/umr/opendesk-edu/opendesk-nix"
  total_services: "78"
  code_repo: "gitlab.opencode.de/umr/opendesk-edu/opendesk-nix"
  deployment_date: "2026-08-05"
  compliance: "OpenSpec 48/48, 0 CVEs, SBOM-enabled, Cosign-signed"
---
# Quick Apply Script (run with: kubectl apply -f deployment-list.yaml)
# This is a helper to verify connectivity to the registry
apiVersion: batch/v1
kind: Job
metadata:
  name: verifyRegistryConnectivity
  namespace: opendesk
spec:
  template:
    spec:
      serviceAccountName: opendesk-service-account
      containers:
        - name: verify
          image: registry.opencode.de/umr/opendesk-edu/opendesk-nix/nginx:1.25.3-nixos
          command: ["echo", "Registry access verified"]
      restartPolicy: Never
  backoffLimit: 0
---
