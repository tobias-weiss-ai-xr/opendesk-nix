apiVersion: v2
name: opendesk-nix
version: 1.0.0
description: Complete OpenDesk Edu NixOS container deployment (78 services)
home: https://gitlab.opencode.de/umr/opendesk-edu/opendesk-nix
type: application
appVersion: "1.0.0"
dependencies:
  - name: mariadb
    version: 1.0.0
    repository: file://./charts/mariadb
    condition: mariadb.enabled
  - name: postgresql
    version: 1.0.0
    repository: file://./charts/postgresql
    condition: postgresql.enabled
  - name: redis
    version: 1.0.0
    repository: file://./charts/redis
    condition: redis.enabled
