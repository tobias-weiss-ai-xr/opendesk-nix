---
apiVersion: v1
kind: Secret
metadata:
  name: opencode-registry-pull-secret
  namespace: opendesk
  labels:
    app: opendesk
    component: image-pull-secret
    registry: opencode.de
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: CHANGE_ME_BASE64_ENCODED_DOCKER_CONFIG
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opendesk-service-account
  namespace: opendesk
  labels:
    app: opendesk
    component: service-account
imagePullSecrets:
  - name: opencode-registry-pull-secret
---