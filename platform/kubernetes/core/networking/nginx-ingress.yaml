---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ingress
  namespace: opendesk
  labels:
    app: nginx-ingress
    component: ingress-controller
    tier: networking
    platform: opendesk
    version: "1.25.3-nixos"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-ingress
  template:
    metadata:
      labels:
        app: nginx-ingress
    spec:
      serviceAccountName: opendesk-service-account
      containers:
        - name: nginx
          image: registry.opencode.de/umr/opendesk-edu/opendesk-nix/nginx:1.25.3-nixos
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
          args:
            - "/docker-entrypoint.sh"
            - "nginx"
            - "-g"
            - "daemon off;"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress
  namespace: opendesk
  labels:
    app: nginx-ingress
spec:
  selector:
    app: nginx-ingress
  ports:
    - port: 80
      targetPort: 80
      name: http
      protocol: TCP
    - port: 443
      targetPort: 443
      name: https
      protocol: TCP
  type: LoadBalancer
  externalTrafficPolicy: Local
---