# Nix configuration for argunix-builder

# Enable Nix daemon socket
require-s.latest-user = false
nix-daemon = true

# Trusted users
trusted-users = root argunix-builder

# Nix store
store = /nix

# Build users group
build-users-group = argunix-builder

# Max jobs
max-jobs = auto

# Substituters
substituters = https://cache.nixos.org/ https://opendesk-cache.opencode.de
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= opendesk-cache:REPLACE_WITH_PUBLIC_KEY

# Temporary directory
tmp-dir = /tmp

# Timeout settings
build-timeout = 3600

# Keep failed builds
keep-failed = true

# GC settings
gc-keep-outputs = true
gc-keep-derivations = true
